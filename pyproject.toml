[project]
name = "aix"
version = "0.1.0"
description = "Universal AI Agent Control Plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anyio>=4.4",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.1",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
security = ["bandit>=1.7", "pip-audit>=2.7"]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "import-linter>=2.0",
    "types-pyyaml",
]

[project.scripts]
aix = "aix.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aix"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs"]  # ruff would reformat Python blocks inside the spec markdown

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
strict = ["src/aix/core", "src/aix/domain", "src/aix/decision"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-p aix_pytest_plugin -ra --strict-markers --strict-config"
markers = [
    "live: talks to real agent CLIs or Jev; skipped unless AIX_LIVE=1",
    "slow: slow test; deselect with -m 'not slow'",
    "allow_network: permit non-localhost sockets for this test",
    "anyio: run the test with the anyio pytest plugin",
]

[tool.coverage.run]
source = ["aix"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
