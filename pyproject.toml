[project]
name = "aix"
version = "0.1.0"
description = "Universal AI Agent Control Plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "anyio>=4.4",
    "aiosqlite>=0.20",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "structlog>=24.1",
    "python-ulid>=2.7",
]

[project.optional-dependencies]
jev = ["typesafe-sdk"]
api = ["fastapi>=0.111", "uvicorn>=0.30"]
security = ["bandit>=1.7", "pip-audit>=2.7"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "import-linter>=2.0",
    "types-pyyaml",
]

[project.scripts]
aix = "aix.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aix"]
